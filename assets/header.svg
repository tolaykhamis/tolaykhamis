<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#141033"/>
      <stop offset="1" stop-color="#1b0e2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2a2d4a" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
    <style>
      .fade{opacity:0;animation:fade 1s ease forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}
      @keyframes fade{to{opacity:1}}
      .draw{stroke-dasharray:620;stroke-dashoffset:620;animation:draw 1.6s ease forwards .2s}
      @keyframes draw{to{stroke-dashoffset:0}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <g fill="#c084fc">
    <circle cx="930" cy="70" r="2.5" class="fade d2"/>
    <circle cx="1010" cy="120" r="2" class="fade d3"/>
    <circle cx="880" cy="150" r="1.8" class="fade d3"/>
    <circle cx="1080" cy="80" r="2.2" class="fade d4"/>
    <circle cx="975" cy="200" r="1.6" class="fade d4"/>
  </g>
  <g stroke="#6d5bd0" stroke-width="0.8" stroke-opacity="0.5">
    <line x1="930" y1="70" x2="1010" y2="120" class="fade d4"/>
    <line x1="1010" y1="120" x2="1080" y2="80" class="fade d4"/>
    <line x1="880" y1="150" x2="975" y2="200" class="fade d4"/>
  </g>

  <rect x="80" y="104" width="6" height="112" rx="3" fill="url(#accent)" class="fade d1"/>

  <text x="112" y="150" font-size="60" font-weight="700" fill="#f5f6fb" class="fade d1">Tolay Khamis</text>
  <text x="114" y="198" font-size="25" font-weight="500" fill="url(#accent)" class="fade d2">Backend Developer &#183; Java &amp; Spring Boot</text>

  <text x="114" y="244" font-size="16" font-family="'JetBrains Mono','Fira Code',monospace" fill="#8b91b4" class="fade d3">
    University of Jordan &#183; 42 Amman &#160;&#8212;&#160; REST APIs, clean architecture, systems in C
  </text>

  <path d="M114 262 H560" stroke="url(#accent)" stroke-width="2" fill="none" class="draw"/>
</svg>
